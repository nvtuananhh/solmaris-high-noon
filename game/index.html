<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmaris — High Noon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1a28;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #fff; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; }
  #health-wrap { width: 220px; height: 18px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5);
    border-radius: 9px; overflow: hidden; position: relative; }
  #health-bar { height: 100%; width: 100%; background: #37d67a; transition: width .2s; }
  #health-num { position: absolute; right: 8px; top: 0; font-size: 12px; line-height: 18px; font-weight: 700;
    text-shadow: 0 1px 2px #000; }
  #cash { font-size: 26px; font-weight: 800; color: #7dff9a; text-shadow: 0 2px 4px rgba(0,0,0,.8); margin-top: 4px; }
  #district { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; opacity: .9;
    text-shadow: 0 1px 3px #000; }
  #hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  #stars { font-size: 26px; letter-spacing: 3px; text-shadow: 0 2px 4px #000; }
  #clock { font-size: 22px; font-weight: 700; text-shadow: 0 2px 4px #000; }
  #weapon { font-size: 12px; opacity: .85; text-shadow: 0 1px 3px #000; margin-top: 2px; }
  #objective { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); max-width: 46%;
    text-align: center; font-size: 15px; font-weight: 600; background: rgba(0,0,0,.55);
    padding: 8px 16px; border-radius: 8px; border-left: 4px solid #ffd23c; }
  #banner { position: absolute; top: 32%; left: 50%; transform: translateX(-50%); font-size: 30px;
    font-weight: 900; letter-spacing: 1px; color: #ffd23c; text-shadow: 0 3px 10px #000;
    opacity: 0; transition: opacity .4s; white-space: nowrap; }
  #messages { position: absolute; left: 16px; bottom: 150px; width: 380px; }
  .msg { background: rgba(0,0,0,.6); border-radius: 6px; padding: 7px 10px; margin-top: 6px;
    font-size: 13.5px; transition: opacity .6s; }
  #hint { position: absolute; bottom: 12px; left: 16px; font-size: 12px; opacity: .75;
    text-shadow: 0 1px 3px #000; }
  #prompt { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 17px;
    font-weight: 700; background: rgba(0,0,0,.65); padding: 8px 18px; border-radius: 8px;
    border: 1px solid rgba(255,210,60,.7); }
  #prompt:empty { display: none; }
  #minimap { position: absolute; right: 16px; bottom: 16px; width: 190px; height: 190px;
    border-radius: 50%; border: 3px solid rgba(255,255,255,.65); box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  #center-screen { position: absolute; top: 44%; left: 50%; transform: translate(-50%,-50%);
    font-size: 44px; font-weight: 900; color: #ff3b30; text-shadow: 0 4px 14px #000; }
  .panel { background: rgba(8, 20, 34, .88); border: 1px solid rgba(255,210,60,.55); border-radius: 14px;
    padding: 34px 40px; max-width: 640px; text-align: center; box-shadow: 0 12px 50px rgba(0,0,0,.6); }
  .panel h1 { font-size: 58px; letter-spacing: 8px; color: #ffd23c; text-shadow: 0 4px 0 #a83c1a, 0 8px 24px #000; }
  .panel h2 { font-size: 26px; letter-spacing: 6px; color: #fff; margin: 2px 0 14px; }
  .panel .tag { font-size: 15px; line-height: 1.55; opacity: .92; }
  .panel .story { font-size: 17px; font-weight: 700; color: #ffd23c; margin: 12px 0 18px; }
  .panel .foot { font-size: 12px; opacity: .65; margin-top: 16px; }
  .panel label { display: block; margin: 10px 0; font-size: 14px; }
  .panel input[type=range] { width: 220px; vertical-align: middle; margin-left: 8px; }
  .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .buttons button { pointer-events: auto; cursor: pointer; font-size: 16px; font-weight: 800;
    letter-spacing: 1px; padding: 12px 22px; border-radius: 9px; border: none;
    background: #ffd23c; color: #231303; }
  .buttons button:hover { background: #ffe27a; }
  .buttons button:disabled { background: #666; color: #bbb; cursor: default; }
  #howto { text-align: left; font-size: 13.5px; line-height: 1.6; margin-top: 14px;
    background: rgba(255,255,255,.07); padding: 12px 14px; border-radius: 8px; }
  #start-screen, #pause-screen, #end-screen { position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center; pointer-events: auto;
    background: radial-gradient(ellipse at center, rgba(10,30,50,.25), rgba(5,12,22,.72)); }
  #start-screen[hidden], #pause-screen[hidden], #end-screen[hidden] { display: none; }
  #end-title { color: #ff3b30; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
